name: Export Secrets to File
on:
  workflow_dispatch:
    inputs:
      file_format:
        description: 'File format'
        required: true
        default: 'env'
        type: choice
        options:
          - env
          - json
          - yaml
          - txt
      include_empty:
        description: 'Include empty secrets'
        type: boolean
        default: false

jobs:
  export-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Create secrets file
        run: |
          FILE_FORMAT="${{ github.event.inputs.file_format }}"
          INCLUDE_EMPTY="${{ github.event.inputs.include_empty }}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          
          echo "Creating secrets file in $FILE_FORMAT format..."
          
          # Create .env format
          if [ "$FILE_FORMAT" = "env" ]; then
            {
              echo "# Secrets exported from ${{ github.repository }} on $(date)"
              echo "# Generated by GitHub Actions workflow"
              echo ""
              echo "# Database Configuration"
              echo "DB_HOST=${{ secrets.DB_HOST }}"
              echo "PORT=${{ secrets.PORT }}"
              echo ""
              echo "# SSH Configuration"
              echo "SSH_USER=${{ secrets.SSH_USER }}"
              echo "SSH_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }}"
              echo "DROPLET_IP=${{ secrets.DROPLET_IP }}"
              echo ""
              echo "# GitHub Configuration"
              echo "USERNAME=${{ secrets.USERNAME }}"
              echo "TOKEN=${{ secrets.TOKEN }}"
              echo ""
              echo "# Cloudinary Configuration"
              echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"
              echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
              echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
              echo ""
              echo "# Environment"
              echo "NODE_ENV=production"
            } > secrets_${TIMESTAMP}.env
          fi
          
          # Create JSON format
          if [ "$FILE_FORMAT" = "json" ]; then
            {
              echo "{"
              echo "  \"metadata\": {"
              echo "    \"repository\": \"${{ github.repository }}\","
              echo "    \"exported_at\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\","
              echo "    \"workflow\": \"${{ github.workflow }}\""
              echo "  },"
              echo "  \"secrets\": {"
              echo "    \"database\": {"
              echo "      \"host\": \"${{ secrets.DB_HOST }}\","
              echo "      \"port\": \"${{ secrets.PORT }}\""
              echo "    },"
              echo "    \"ssh\": {"
              echo "      \"user\": \"${{ secrets.SSH_USER }}\","
              echo "      \"private_key\": \"${{ secrets.SSH_PRIVATE_KEY }}\","
              echo "      \"droplet_ip\": \"${{ secrets.DROPLET_IP }}\""
              echo "    },"
              echo "    \"github\": {"
              echo "      \"username\": \"${{ secrets.USERNAME }}\","
              echo "      \"token\": \"${{ secrets.TOKEN }}\""
              echo "    },"
              echo "    \"cloudinary\": {"
              echo "      \"cloud_name\": \"${{ secrets.CLOUDINARY_CLOUD_NAME }}\","
              echo "      \"api_key\": \"${{ secrets.CLOUDINARY_API_KEY }}\","
              echo "      \"api_secret\": \"${{ secrets.CLOUDINARY_API_SECRET }}\""
              echo "    }"
              echo "  }"
              echo "}"
            } > secrets_${TIMESTAMP}.json
          fi
          
          # Create YAML format
          if [ "$FILE_FORMAT" = "yaml" ]; then
            {
              echo "# Secrets exported from ${{ github.repository }} on $(date)"
              echo "# Generated by GitHub Actions workflow"
              echo ""
              echo "metadata:"
              echo "  repository: \"${{ github.repository }}\""
              echo "  exported_at: \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\""
              echo "  workflow: \"${{ github.workflow }}\""
              echo ""
              echo "secrets:"
              echo "  database:"
              echo "    host: \"${{ secrets.DB_HOST }}\""
              echo "    port: \"${{ secrets.PORT }}\""
              echo "  ssh:"
              echo "    user: \"${{ secrets.SSH_USER }}\""
              echo "    private_key: \"${{ secrets.SSH_PRIVATE_KEY }}\""
              echo "    droplet_ip: \"${{ secrets.DROPLET_IP }}\""
              echo "  github:"
              echo "    username: \"${{ secrets.USERNAME }}\""
              echo "    token: \"${{ secrets.TOKEN }}\""
              echo "  cloudinary:"
              echo "    cloud_name: \"${{ secrets.CLOUDINARY_CLOUD_NAME }}\""
              echo "    api_key: \"${{ secrets.CLOUDINARY_API_KEY }}\""
              echo "    api_secret: \"${{ secrets.CLOUDINARY_API_SECRET }}\""
            } > secrets_${TIMESTAMP}.yaml
          fi
          
          # Create TXT format
          if [ "$FILE_FORMAT" = "txt" ]; then
            {
              echo "SECRETS EXPORT FROM ${{ github.repository }}"
              echo "Generated: $(date)"
              echo "Workflow: ${{ github.workflow }}"
              echo ""
              echo "=== DATABASE CONFIGURATION ==="
              echo "DB_HOST=${{ secrets.DB_HOST }}"
              echo "PORT=${{ secrets.PORT }}"
              echo ""
              echo "=== SSH CONFIGURATION ==="
              echo "SSH_USER=${{ secrets.SSH_USER }}"
              echo "SSH_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }}"
              echo "DROPLET_IP=${{ secrets.DROPLET_IP }}"
              echo ""
              echo "=== GITHUB CONFIGURATION ==="
              echo "USERNAME=${{ secrets.USERNAME }}"
              echo "TOKEN=${{ secrets.TOKEN }}"
              echo ""
              echo "=== CLOUDINARY CONFIGURATION ==="
              echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"
              echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
              echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
              echo ""
              echo "=== ENVIRONMENT ==="
              echo "NODE_ENV=production"
            } > secrets_${TIMESTAMP}.txt
          fi
          
          echo "✅ Secrets file created: secrets_${TIMESTAMP}.${FILE_FORMAT}"

      - name: Create encrypted backup
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          FILE_FORMAT="${{ github.event.inputs.file_format }}"
          
          # Create a simple password for encryption (you can change this)
          ENCRYPTION_KEY="bomberman-secrets-$(date +%s)"
          echo "Encryption key: $ENCRYPTION_KEY" > encryption_key.txt
          
          # Encrypt the file using openssl
          openssl enc -aes-256-cbc -salt -in "secrets_${TIMESTAMP}.${FILE_FORMAT}" -out "secrets_${TIMESTAMP}_encrypted.${FILE_FORMAT}.enc" -pass pass:"$ENCRYPTION_KEY"
          
          echo "🔐 Encrypted backup created: secrets_${TIMESTAMP}_encrypted.${FILE_FORMAT}.enc"

      - name: Upload secrets file
        uses: actions/upload-artifact@v4
        with:
          name: secrets-export-${{ github.event.inputs.file_format }}-${{ github.run_number }}
          path: |
            secrets_*.env
            secrets_*.json
            secrets_*.yaml
            secrets_*.txt
            secrets_*_encrypted.*.enc
            encryption_key.txt
          retention-days: 1

      - name: Security warning
        run: |
          echo "⚠️  SECURITY WARNING ⚠️"
          echo "The secrets file contains sensitive information!"
          echo "Please:"
          echo "1. Download the file immediately"
          echo "2. Delete it from your local machine after use"
          echo "3. Never commit it to version control"
          echo "4. The artifact will be automatically deleted in 1 day" 
