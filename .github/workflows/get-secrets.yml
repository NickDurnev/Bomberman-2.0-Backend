name: Export Secrets to File
on:
  workflow_dispatch:
    inputs:
      file_format:
        description: 'File format'
        required: true
        default: 'env'
        type: choice
        options:
          - env
          - json
          - yaml
          - txt
      include_empty:
        description: 'Include empty secrets'
        type: boolean
        default: false

jobs:
  export-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Create secrets file
        run: |
          FILE_FORMAT="${{ github.event.inputs.file_format }}"
          INCLUDE_EMPTY="${{ github.event.inputs.include_empty }}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          
          echo "Creating secrets file in $FILE_FORMAT format..."
          
          # Create .env format
          if [ "$FILE_FORMAT" = "env" ]; then
            cat <<EOF > secrets_${TIMESTAMP}.env
# Secrets exported from ${{ github.repository }} on $(date)
# Generated by GitHub Actions workflow

# Database Configuration
DB_HOST=${{ secrets.DB_HOST }}
PORT=${{ secrets.PORT }}

# SSH Configuration
SSH_USER=${{ secrets.SSH_USER }}
SSH_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }}
DROPLET_IP=${{ secrets.DROPLET_IP }}

# GitHub Configuration
USERNAME=${{ secrets.USERNAME }}
TOKEN=${{ secrets.TOKEN }}

# Cloudinary Configuration
CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}

# Environment
NODE_ENV=production
EOF
          fi
          
          # Create JSON format
          if [ "$FILE_FORMAT" = "json" ]; then
            cat <<EOF > secrets_${TIMESTAMP}.json
{
  "metadata": {
    "repository": "${{ github.repository }}",
    "exported_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
    "workflow": "${{ github.workflow }}"
  },
  "secrets": {
    "database": {
      "host": "${{ secrets.DB_HOST }}",
      "port": "${{ secrets.PORT }}"
    },
    "ssh": {
      "user": "${{ secrets.SSH_USER }}",
      "private_key": "${{ secrets.SSH_PRIVATE_KEY }}",
      "droplet_ip": "${{ secrets.DROPLET_IP }}"
    },
    "github": {
      "username": "${{ secrets.USERNAME }}",
      "token": "${{ secrets.TOKEN }}"
    },
    "cloudinary": {
      "cloud_name": "${{ secrets.CLOUDINARY_CLOUD_NAME }}",
      "api_key": "${{ secrets.CLOUDINARY_API_KEY }}",
      "api_secret": "${{ secrets.CLOUDINARY_API_SECRET }}"
    }
  }
}
EOF
          fi
          
          # Create YAML format
          if [ "$FILE_FORMAT" = "yaml" ]; then
            cat <<EOF > secrets_${TIMESTAMP}.yaml
# Secrets exported from ${{ github.repository }} on $(date)
# Generated by GitHub Actions workflow

metadata:
  repository: "${{ github.repository }}"
  exported_at: "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
  workflow: "${{ github.workflow }}"

secrets:
  database:
    host: "${{ secrets.DB_HOST }}"
    port: "${{ secrets.PORT }}"
  
  ssh:
    user: "${{ secrets.SSH_USER }}"
    private_key: "${{ secrets.SSH_PRIVATE_KEY }}"
    droplet_ip: "${{ secrets.DROPLET_IP }}"
  
  github:
    username: "${{ secrets.USERNAME }}"
    token: "${{ secrets.TOKEN }}"
  
  cloudinary:
    cloud_name: "${{ secrets.CLOUDINARY_CLOUD_NAME }}"
    api_key: "${{ secrets.CLOUDINARY_API_KEY }}"
    api_secret: "${{ secrets.CLOUDINARY_API_SECRET }}"
EOF
          fi
          
          # Create TXT format
          if [ "$FILE_FORMAT" = "txt" ]; then
            cat <<EOF > secrets_${TIMESTAMP}.txt
SECRETS EXPORT FROM ${{ github.repository }}
Generated: $(date)
Workflow: ${{ github.workflow }}

=== DATABASE CONFIGURATION ===
DB_HOST=${{ secrets.DB_HOST }}
PORT=${{ secrets.PORT }}

=== SSH CONFIGURATION ===
SSH_USER=${{ secrets.SSH_USER }}
SSH_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }}
DROPLET_IP=${{ secrets.DROPLET_IP }}

=== GITHUB CONFIGURATION ===
USERNAME=${{ secrets.USERNAME }}
TOKEN=${{ secrets.TOKEN }}

=== CLOUDINARY CONFIGURATION ===
CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}

=== ENVIRONMENT ===
NODE_ENV=production
EOF
          fi
          
          echo "✅ Secrets file created: secrets_${TIMESTAMP}.${FILE_FORMAT}"

      - name: Create encrypted backup
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          FILE_FORMAT="${{ github.event.inputs.file_format }}"
          
          # Create a simple password for encryption (you can change this)
          ENCRYPTION_KEY="bomberman-secrets-$(date +%s)"
          echo "Encryption key: $ENCRYPTION_KEY" > encryption_key.txt
          
          # Encrypt the file using openssl
          openssl enc -aes-256-cbc -salt -in "secrets_${TIMESTAMP}.${FILE_FORMAT}" -out "secrets_${TIMESTAMP}_encrypted.${FILE_FORMAT}.enc" -pass pass:"$ENCRYPTION_KEY"
          
          echo "🔐 Encrypted backup created: secrets_${TIMESTAMP}_encrypted.${FILE_FORMAT}.enc"

      - name: Upload secrets file
        uses: actions/upload-artifact@v4
        with:
          name: secrets-export-${{ github.event.inputs.file_format }}-${{ github.run_number }}
          path: |
            secrets_*.env
            secrets_*.json
            secrets_*.yaml
            secrets_*.txt
            secrets_*_encrypted.*.enc
            encryption_key.txt
          retention-days: 1

      - name: Security warning
        run: |
          echo "⚠️  SECURITY WARNING ⚠️"
          echo "The secrets file contains sensitive information!"
          echo "Please:"
          echo "1. Download the file immediately"
          echo "2. Delete it from your local machine after use"
          echo "3. Never commit it to version control"
          echo "4. The artifact will be automatically deleted in 1 day" 
