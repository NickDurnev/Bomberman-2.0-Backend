name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Husky's prepare script is for local dev hooks; skip it in CI.
            export HUSKY=0

            echo "Loading NVM..."
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 22.14.0

            # Fail the job (and surface a red check) if any step below fails,
            # instead of silently continuing and reporting success. Enabled
            # after the nvm sourcing above, which can return nonzero benignly.
            set -e

            cd Bomberman-2.0-Backend

            echo "Syncing repository to origin/main..."
            # Fetch and hard-reset to the REMOTE ref. The previous approach
            # (reset --hard HEAD + git pull) reset to the droplet's local HEAD
            # and relied on the pull advancing it; when the pull failed the
            # droplet stayed frozen on an old commit while CI still went green.
            git fetch https://${{ secrets.USERNAME }}:${{ secrets.TOKEN }}@github.com/${{ secrets.USERNAME }}/Bomberman-2.0-Backend.git main
            git reset --hard FETCH_HEAD
            git clean -fd

            echo "Updating environment variables..."
            cat <<EOF > .env
            PORT=${{ secrets.PORT }}
            DB_HOST=${{ secrets.DB_HOST }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            NODE_ENV=production
            EOF

            echo "Cleaning old build..."
            rm -rf dist

            echo "Installing dependencies..."
            # --ignore-scripts: the package "prepare" script runs husky, which is
            # a devDependency and absent in a production install — without this it
            # exits 127 ("husky: not found"). We don't want git hooks on the server
            # anyway. (Previously this error was silently ignored.)
            npm install --production --ignore-scripts
            npm install --save-dev --ignore-scripts @types/express @types/node-cron @types/uuid

            echo "Building the application..."
            npm run build

            mkdir -p dist  
            if [ -d src/maps ]; then
              npx copyfiles -u 1 src/maps/* dist
            fi

            echo "Restarting application..."
            pm2 delete app || true
            pm2 start dist/app.js --name app --env production
            pm2 save
